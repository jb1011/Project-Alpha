[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# via_ir required: LegalManagerFactory.createEntity (9 params + 3 returns) overflows the legacy
# stack. This enables the IR pipeline project-wide. evm_version stays "paris" (no PUSH0) so Arc
# compatibility is preserved. NOTE: before mainnet, re-review the audited contracts at the
# bytecode level under IR (sources unchanged; codegen differs from the pre-IR test runs).
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]
# Read-only access to the build artifacts. NoviController.t.sol derives the controller's LOCAL
# selector surface from out/NoviController.sol/NoviController.json (`methodIdentifiers`) instead of
# a hand-pinned list, so the selector-disjointness test can never be checked against a stale copy
# of the ABI. Read-only and scoped to the output directory.
fs_permissions = [{ access = "read", path = "./out" }]

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
